[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.0"
authors = ["markMarkinson"]
edition = "2024"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Documentation boilerplate and attribute noise that would not make this code better.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
# Writing into a String with `push_str(&format!(..))` is fine for short strings.
format_push_string = "allow"
# `assert!(x.is_empty())` reads better than comparing with an empty array in tests.
assert_is_empty = "allow"
# The app targets 64-bit Windows; the casts are between sizes that fit there.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# Release profile tuned for binary size; the app is I/O-bound, so optimising
# for size costs no noticeable speed.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
